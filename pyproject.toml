[project]
name = "film-reco"
version = "0.1.0"
description = "Film recommendations from a Letterboxd export, enriched with TMDB"
readme = "README.md"
authors = [
    { name = "Nafety", email = "thomas.barsot@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=6.1.0",
    "tenacity>=9.2.1",
]

[project.scripts]
film-reco = "film_reco:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
